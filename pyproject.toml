[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "Otaviogkk",email = "joseotaviolucianosousachagas@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.143.2,<0.144.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "typos (>=1.51.1,<2.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)"
]
[tool.poe.tasks]
test = "pytest --cov=fast_zero --cov-report=term-missing --cov-report=html"